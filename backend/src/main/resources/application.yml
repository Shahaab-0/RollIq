server:
  port: 8080

spring:
  application:
    name: rolliq-api
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  access-token-ttl-minutes: 60
  refresh-token-ttl-days: 30
